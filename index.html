        <h2>迷因是啥?</h2>
        <p>「迷因」（Meme）最初是由英國演化生物學家理查·道金斯（Richard Dawkins）在 1976 年的著作《自私的基因》中提出的概念，用來指稱文化資訊傳遞的基本單位——就像生物學裡的「基因（Gene）」負責遺傳生物特徵一樣，迷因負責在人與人之間模仿、複製和傳播文化、思想或行為模式。
在現代網路語境中，迷因（網路迷因，Internet Meme）通常指在網路上快速傳播、被大量模仿與二創的幽默文化載體。</p>
